<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ANDREW — Bass Drop Visualizer</title>
<style>
  :root {
    /* active theme vars — overwritten by JS setTheme() */
    --menace: #d20a12;
    --menace-dim: #6e0508;
    --bone: #c8bfb4;
    --accent2: #2a0406;   /* secondary tint used in effects */
    --washR: 160; --washG: 6; --washB: 10; /* menace wash rgb */
    --grade: #7a1015;     /* portrait engraving grade */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; overflow: hidden;
    font-family: "Courier New", monospace; touch-action: manipulation; }

  #stage { position: fixed; inset: 0; display: grid; place-items: center;
    background: radial-gradient(ellipse at center, #180404 0%, #000 70%); }
  canvas#c { display: block; max-width: 100%; max-height: 100%; }

  #dock {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center;
    max-width: 94vw; padding: 12px 16px;
    background: rgba(10,3,3,.82); border: 1px solid var(--menace-dim);
    backdrop-filter: blur(6px); letter-spacing: .12em; font-size: 12px;
    text-transform: uppercase; color: var(--bone); z-index: 20; transition: opacity .5s ease;
  }
  #dock.hidden { opacity: 0; pointer-events: none; }
  #dock label, #dock button {
    color: var(--bone); background: transparent; border: 1px solid var(--menace-dim);
    padding: 8px 12px; cursor: pointer; letter-spacing: .12em; font: inherit;
    text-transform: uppercase; transition: all .15s ease; white-space: nowrap;
  }
  #dock button:hover, #dock label:hover { border-color: var(--menace); color: #fff; box-shadow: 0 0 12px rgba(210,10,18,.4); }
  #dock button:active, #dock label:active { border-color: var(--menace); color: #fff; }
  #dock input[type=file] { display: none; }
  #dock .sens { display: flex; flex-direction: column; gap: 3px; }
  #dock .sens span { font-size: 9px; opacity: .6; }
  #dock input[type=range] { width: 90px; accent-color: var(--menace); }
  #trackname { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .7; font-size: 10px; }
  #hint {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: var(--menace); letter-spacing: .35em; font-size: 11px; text-transform: uppercase;
    z-index: 20; opacity: .55; text-shadow: 0 0 8px currentColor; transition: opacity .35s, letter-spacing .35s, color .3s;
    text-align: center; max-width: 90vw; white-space: nowrap; pointer-events: none;
  }
  #hint.hidden { opacity: 0; }
  #hint.flash { opacity: .95; letter-spacing: .5em; color: var(--bone); font-weight: bold; }
  #hint.swap { opacity: 0; }
  /* live bass meter so you can SEE it reacting */
  #meter { position: fixed; left: 16px; bottom: 90px; width: 10px; height: 120px;
    border: 1px solid var(--menace-dim); z-index: 20; transition: opacity .5s; }
  #meter.hidden { opacity: 0; }
  #meterfill { position:absolute; bottom:0; left:0; width:100%; height:0%;
    background: linear-gradient(to top, #6e0508, #d20a12); }

  /* ---- SCRUBBER / SEEK BAR ---- */
  #scrubwrap {
    position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%);
    width: min(560px, 92vw); z-index: 20; transition: opacity .5s ease;
    display: flex; flex-direction: column; gap: 5px;
  }
  #scrubwrap.hidden { opacity: 0; pointer-events: none; }
  #scrubwrap.disabled { opacity: .3; pointer-events: none; }
  #scrubtrack {
    position: relative; height: 26px; display: flex; align-items: center;
    cursor: pointer; touch-action: none;
  }
  #scrubrail {
    position: absolute; left: 0; right: 0; height: 5px; top: 50%; transform: translateY(-50%);
    background: rgba(110,5,8,.5); border: 1px solid var(--menace-dim);
  }
  #scrubfill {
    position: absolute; left: 0; height: 5px; top: 50%; transform: translateY(-50%);
    width: 0%; background: linear-gradient(to right, #6e0508, #d20a12);
    box-shadow: 0 0 10px rgba(210,10,18,.6);
  }
  #scrubhandle {
    position: absolute; top: 50%; left: 0; width: 16px; height: 16px;
    transform: translate(-50%, -50%); background: #d20a12;
    border: 2px solid #1a0303; box-shadow: 0 0 12px rgba(210,10,18,.9);
    /* diamond for the menace look */
    rotate: 45deg;
  }
  #scrubtimes {
    display: flex; justify-content: space-between; font-size: 10px;
    color: var(--bone); opacity: .65; letter-spacing: .1em;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }

  /* ---- MOBILE ---- */
  @media (max-width: 640px) {
    #dock { gap: 8px; padding: 10px 12px; bottom: 14px; font-size: 11px; }
    #dock label, #dock button { padding: 10px 12px; font-size: 11px; }
    #dock .sens { order: 5; width: 100%; align-items: center; }
    #dock input[type=range] { width: 70vw; height: 28px; }
    #trackname { order: 6; width: 100%; text-align: center; max-width: 90vw; }
    #scrubwrap { bottom: 128px; width: 90vw; }
    #scrubtimes { font-size: 13px; opacity: .8; padding: 0 2px; }
    #tcur, #tdur { font-variant-numeric: tabular-nums; }
    #meter { left: 10px; bottom: 130px; height: 90px; }
    #hint { font-size: 9px; letter-spacing: .25em; top: 14px; }
    #scrubhandle { width: 22px; height: 22px; } /* bigger touch target */
    #scrubtrack { height: 34px; }
    #panel { width: 88vw; max-width: 360px; }
  }

  /* ---- SETTINGS: gear button + panel ---- */
  #gear {
    position: fixed; top: 16px; right: 16px; z-index: 30;
    width: 42px; height: 42px; display: grid; place-items: center;
    background: rgba(10,3,3,.82); border: 1px solid var(--menace-dim);
    color: var(--bone); cursor: pointer; font-size: 20px; line-height: 1;
    backdrop-filter: blur(6px); transition: all .15s ease;
  }
  #gear:hover { border-color: var(--menace); color:#fff; box-shadow: 0 0 12px rgba(210,10,18,.4); }
  #gear.hidden { opacity: 0; pointer-events: none; }

  #panel {
    position: fixed; top: 66px; right: 16px; z-index: 30;
    width: 320px; max-height: 80vh; overflow-y: auto;
    background: rgba(8,3,3,.94); border: 1px solid var(--menace-dim);
    backdrop-filter: blur(8px); color: var(--bone);
    padding: 16px; letter-spacing: .08em; font-size: 12px;
    transform: translateX(120%); transition: transform .3s ease;
  }
  #panel.open { transform: translateX(0); }
  #panel h3 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .2em;
    color: var(--menace); margin: 14px 0 8px; opacity: .9;
    border-bottom: 1px solid var(--menace-dim); padding-bottom: 5px;
  }
  #panel h3:first-child { margin-top: 0; }
  .prow { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; gap: 10px; }
  .prow .plabel { text-transform: uppercase; font-size: 11px; flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 7px 10px; border: 1px solid var(--menace-dim); color: var(--bone);
    text-transform: uppercase; font-size: 10px; letter-spacing: .1em; cursor: pointer;
    background: transparent; transition: all .12s ease; user-select: none;
  }
  .chip:hover { border-color: var(--menace); }
  .chip.active { background: var(--menace); color: #120202; border-color: var(--menace); font-weight: bold; }
  /* toggle switch */
  .sw { position: relative; display: inline-block; width: 40px; height: 22px; flex: 0 0 auto; cursor: pointer; }
  .sw input { display: none; }
  .sw .track { position:absolute; inset:0; background: rgba(110,5,8,.4); border:1px solid var(--menace-dim); transition: .15s; }
  .sw .knob { position:absolute; top:2px; left:2px; width:16px; height:16px; background: var(--bone); transition: .15s; }
  .sw input:checked + .track { background: var(--menace); }
  .sw input:checked + .track + .knob { left: 20px; background:#120202; }
  #panel input[type=range] { width: 100%; accent-color: var(--menace); }
  .rangelabel { display:flex; justify-content:space-between; font-size:10px; opacity:.7; margin-bottom:3px; text-transform:uppercase; }
  .panelclose { float:right; cursor:pointer; color:var(--bone); opacity:.6; font-size:16px; line-height:1; }
  .panelclose:hover { opacity:1; color:#fff; }
  @media (max-width: 640px) {
    #panel { top: 62px; right: 6vw; }
    .chip { padding: 9px 12px; font-size: 11px; }
    .sw { width: 46px; height: 26px; }
    .sw .knob { width:20px; height:20px; }
    .sw input:checked + .track + .knob { left: 22px; }
  }
</style>

</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="hint">TWENTY DOLLARS · BASS TRIGGERED</div>
  <div id="meter"><div id="meterfill"></div></div>

  <div id="scrubwrap" class="disabled">
    <div id="scrubtrack">
      <div id="scrubrail"></div>
      <div id="scrubfill"></div>
      <div id="scrubhandle"></div>
    </div>
    <div id="scrubtimes"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>
  </div>

  <div id="dock">
    <label for="file">Load Mix</label>
    <input type="file" id="file" accept="audio/*">
    <label for="imgfile">Load Face</label>
    <input type="file" id="imgfile" accept="image/*">
    <button id="play">Play</button>
    <div class="sens">
      <span>Drop Sensitivity</span>
      <input type="range" id="sens" min="0.5" max="2.2" step="0.02" value="1.1">
    </div>
    <span id="trackname">no file loaded</span>
  </div>

  <div id="gear">⚙</div>
  <div id="panel">
    <span class="panelclose" id="panelclose">✕</span>
    <h3>Presets</h3>
    <div class="chips" id="presets">
      <button class="chip" data-preset="menace">Menace</button>
      <button class="chip" data-preset="fulltrip">Full Trip</button>
      <button class="chip" data-preset="minimal">Minimal</button>
      <button class="chip" data-preset="vhs">VHS Horror</button>
    </div>

    <h3>Color Theme</h3>
    <div class="chips" id="themes">
      <button class="chip active" data-theme="red">Red / Black</button>
      <button class="chip" data-theme="green">Green CRT</button>
      <button class="chip" data-theme="purple">Vaporwave</button>
      <button class="chip" data-theme="gold">Gold Regal</button>
    </div>

    <h3>Drop Selection</h3>
    <div class="chips" id="selmodes">
      <button class="chip active" data-sel="random">Random</button>
      <button class="chip" data-sel="key">By Key</button>
      <button class="chip" data-sel="cycle">Cycle</button>
      <button class="chip" data-sel="lock">Locked</button>
    </div>
    <div id="lockpick" style="display:none; margin-top:8px;">
      <div class="chips" id="lockeffects"></div>
    </div>

    <h3>Effects In Rotation</h3>
    <div id="fxtoggles"></div>

    <h3>Intensity</h3>
    <div class="rangelabel"><span>Subtle</span><span>Extreme</span></div>
    <input type="range" id="intensity" min="0.4" max="1.8" step="0.02" value="1">

    <h3>Orbit Ring</h3>
    <div class="rangelabel"><span>Orbiting Jacksons</span><span id="orbitval">6</span></div>
    <input type="range" id="orbitcount" min="1" max="9" step="1" value="6">
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

/* ============================================================
   CONFIG / EFFECT REGISTRY
   ============================================================ */
// each effect: id, label, and whether it's enabled in the rotation
const EFFECTS = [
  { id: 'chroma',    label: 'Chroma Slam', on: true },
  { id: 'kaleido',   label: 'Kaleidoscope', on: true },
  { id: 'echoes',    label: 'Echoes', on: true },
  { id: 'rgbsplit',  label: 'RGB Split', on: true },
  { id: 'invert',    label: 'Invert Flash', on: true },
  { id: 'shear',     label: 'Shear Glitch', on: true },
  { id: 'mirror',    label: 'Mirror Flip', on: true },
  { id: 'orbit',     label: 'Orbit Ring', on: true },
  { id: 'pulse',     label: 'Clean Pulse', on: true },
];
// standalone toggles for the ambient/overlay effects
const OVERLAYS = {
  shockwave: true,
  tracking: true,
  slices: true,
  grain: true,
  idleflip: true,
};
const config = {
  selection: 'random',   // random | key | cycle | lock
  lockId: 'chroma',
  intensity: 1,
  theme: 'red',
  cycleIdx: 0,
  orbitCount: 6,         // number of little Andys in the Orbit Ring effect (1–9)
};

const THEMES = {
  red:    { menace:'#d20a12', dim:'#6e0508', bone:'#c8bfb4', accent2:'#2a0406', wash:[160,6,10],  grade:'#7a1015' },
  green:  { menace:'#39ff5a', dim:'#0a5a1e', bone:'#bfe8c4', accent2:'#052a10', wash:[10,120,40], grade:'#0f5a22' },
  purple: { menace:'#c04dff', dim:'#3a1a6e', bone:'#d9c8f0', accent2:'#1a0630', wash:[120,20,200],grade:'#5a1580', altcyan:'#22e6ff' },
  gold:   { menace:'#f0b429', dim:'#6e4a05', bone:'#e8dcc0', accent2:'#2a1c04', wash:[180,130,20],grade:'#7a5510' },
};

function setTheme(name) {
  const t = THEMES[name]; if (!t) return;
  config.theme = name;
  const r = document.documentElement.style;
  r.setProperty('--menace', t.menace);
  r.setProperty('--menace-dim', t.dim);
  r.setProperty('--bone', t.bone);
  r.setProperty('--accent2', t.accent2);
  r.setProperty('--washR', t.wash[0]); r.setProperty('--washG', t.wash[1]); r.setProperty('--washB', t.wash[2]);
  r.setProperty('--grade', t.grade);
  THEME = t; // live reference for canvas drawing
  buildPortrait(port.width, port.height); // re-grade the portrait
}
let THEME = THEMES.red;

/* ============================================================
   PORTRAIT
   A stronger, more readable engraved Jackson bust is drawn to
   an offscreen canvas. You can also click "Load Face" to drop
   in the real public-domain $20 portrait — it replaces this.
   ============================================================ */
const port = document.createElement('canvas');
const pctx = port.getContext('2d');
let customImg = null; // set when user loads a real image

function buildPortrait(w, h) {
  port.width = w; port.height = h;
  pctx.clearRect(0,0,w,h);
  const cx = w/2, cy = h*0.5;

  if (customImg) {
    // draw uploaded image "cover" into the portrait canvas
    const ir = customImg.width/customImg.height, cr = w/h;
    let dw, dh, dx, dy;
    if (ir > cr) { dh = h; dw = h*ir; dx = (w-dw)/2; dy = 0; }
    else { dw = w; dh = w/ir; dx = 0; dy = (h-dh)/2; }
    pctx.fillStyle = '#000'; pctx.fillRect(0,0,w,h);
    pctx.drawImage(customImg, dx, dy, dw, dh);
    // themed engraving grade over the photo
    pctx.globalCompositeOperation = 'multiply';
    pctx.fillStyle = THEME.grade; pctx.fillRect(0,0,w,h);
    pctx.globalCompositeOperation = 'source-over';
    return;
  }

  // -- procedural engraved bust (much higher contrast than v1) --
  pctx.fillStyle = '#0b0404'; pctx.fillRect(0,0,w,h);

  pctx.save();
  pctx.beginPath();
  pctx.ellipse(cx, cy, w*0.36, h*0.44, 0, 0, Math.PI*2);
  pctx.clip();

  // luminous face field
  const g = pctx.createRadialGradient(cx, cy-h*0.08, 8, cx, cy, w*0.5);
  g.addColorStop(0, '#f6efe2');
  g.addColorStop(0.55, '#cabfae');
  g.addColorStop(1, '#241a17');
  pctx.fillStyle = g; pctx.fillRect(0,0,w,h);

  const uw = w, uh = h; // unit refs
  // ---- signature tall swept-back hair ----
  pctx.fillStyle = '#241713';
  pctx.beginPath();
  pctx.moveTo(cx - uw*0.20, cy - uh*0.10);
  pctx.bezierCurveTo(cx - uw*0.34, cy - uh*0.50, cx - uw*0.10, cy - uh*0.58, cx, cy - uh*0.52);
  pctx.bezierCurveTo(cx + uw*0.10, cy - uh*0.58, cx + uw*0.30, cy - uh*0.48, cx + uw*0.19, cy - uh*0.08);
  pctx.bezierCurveTo(cx + uw*0.10, cy - uh*0.26, cx - uw*0.10, cy - uh*0.26, cx - uw*0.20, cy - uh*0.10);
  pctx.fill();
  // wispy strands
  pctx.strokeStyle = 'rgba(20,12,9,0.5)'; pctx.lineWidth = 1.5;
  for (let i=0;i<10;i++){
    const sx = cx - uw*0.18 + i*(uw*0.04);
    pctx.beginPath();
    pctx.moveTo(sx, cy - uh*0.14);
    pctx.quadraticCurveTo(sx + (Math.random()-0.5)*20, cy - uh*0.42, sx + (Math.random()-0.5)*30, cy - uh*0.50);
    pctx.stroke();
  }

  // ---- face oval ----
  pctx.fillStyle = 'rgba(246,239,226,0.9)';
  pctx.beginPath();
  pctx.ellipse(cx, cy - uh*0.02, uw*0.15, uh*0.21, 0, 0, Math.PI*2);
  pctx.fill();

  // brow ridge + deep-set eyes
  pctx.fillStyle = 'rgba(30,18,14,0.55)';
  pctx.fillRect(cx - uw*0.12, cy - uh*0.11, uw*0.24, uh*0.012);
  pctx.fillStyle = '#1a0f0c';
  pctx.beginPath(); pctx.ellipse(cx - uw*0.06, cy - uh*0.075, uw*0.02, uh*0.014, 0,0,Math.PI*2); pctx.fill();
  pctx.beginPath(); pctx.ellipse(cx + uw*0.06, cy - uh*0.075, uw*0.02, uh*0.014, 0,0,Math.PI*2); pctx.fill();

  // long nose
  pctx.strokeStyle = 'rgba(30,18,14,0.5)'; pctx.lineWidth = 2;
  pctx.beginPath(); pctx.moveTo(cx, cy - uh*0.06); pctx.lineTo(cx - uw*0.015, cy + uh*0.03); pctx.stroke();

  // set mouth
  pctx.strokeStyle = 'rgba(30,18,14,0.6)'; pctx.lineWidth = 2.5;
  pctx.beginPath(); pctx.moveTo(cx - uw*0.05, cy + uh*0.07); pctx.quadraticCurveTo(cx, cy + uh*0.085, cx + uw*0.05, cy + uh*0.07); pctx.stroke();

  // jaw shading
  pctx.fillStyle = 'rgba(40,28,22,0.3)';
  pctx.beginPath();
  pctx.moveTo(cx - uw*0.13, cy + uh*0.02);
  pctx.quadraticCurveTo(cx, cy + uh*0.26, cx + uw*0.13, cy + uh*0.02);
  pctx.quadraticCurveTo(cx, cy + uh*0.14, cx - uw*0.13, cy + uh*0.02);
  pctx.fill();

  // high collar + coat
  pctx.fillStyle = '#0e0706';
  pctx.beginPath();
  pctx.moveTo(cx - uw*0.32, cy + uh*0.44);
  pctx.lineTo(cx - uw*0.09, cy + uh*0.18);
  pctx.lineTo(cx, cy + uh*0.22);
  pctx.lineTo(cx + uw*0.09, cy + uh*0.18);
  pctx.lineTo(cx + uw*0.32, cy + uh*0.44);
  pctx.closePath(); pctx.fill();
  // white collar points
  pctx.fillStyle = 'rgba(246,239,226,0.85)';
  pctx.beginPath();
  pctx.moveTo(cx - uw*0.055, cy + uh*0.14);
  pctx.lineTo(cx, cy + uh*0.23);
  pctx.lineTo(cx + uw*0.055, cy + uh*0.14);
  pctx.lineTo(cx, cy + uh*0.17);
  pctx.closePath(); pctx.fill();

  // engraved hatch shading
  pctx.globalAlpha = 0.12; pctx.strokeStyle = '#000'; pctx.lineWidth = 1;
  for (let y=0; y<h; y+=3){
    pctx.beginPath();
    pctx.moveTo(0, y + Math.sin(y*0.05)*2);
    pctx.lineTo(w, y - Math.sin(y*0.05)*2);
    pctx.stroke();
  }
  pctx.globalAlpha = 1;
  pctx.restore();

  // ornate oval frame + numerals
  pctx.strokeStyle = 'rgba(200,180,150,0.55)'; pctx.lineWidth = 3;
  pctx.beginPath(); pctx.ellipse(cx, cy, w*0.36, h*0.44, 0,0,Math.PI*2); pctx.stroke();
  pctx.fillStyle = 'rgba(200,180,150,0.6)';
  pctx.font = `bold ${Math.floor(h*0.11)}px Georgia`;
  pctx.textAlign='left';  pctx.fillText('20', w*0.05, h*0.17);
  pctx.textAlign='right'; pctx.fillText('20', w*0.95, h*0.95);
  pctx.textAlign='left';
}

/* ============================================================
   AUDIO
   ============================================================ */
let audioCtx, analyser, srcNode, audioEl, freqData;
let playing = false;
const fileInput = document.getElementById('file');
const imgInput  = document.getElementById('imgfile');
const playBtn   = document.getElementById('play');
const sensSlider= document.getElementById('sens');
const trackname = document.getElementById('trackname');
const dock = document.getElementById('dock');
const hint = document.getElementById('hint');
const meter = document.getElementById('meter');
const meterfill = document.getElementById('meterfill');
const scrubwrap = document.getElementById('scrubwrap');
const scrubtrack = document.getElementById('scrubtrack');
const scrubfill = document.getElementById('scrubfill');
const scrubhandle = document.getElementById('scrubhandle');
const tcur = document.getElementById('tcur');
const tdur = document.getElementById('tdur');

/* ============================================================
   HINT TEXT CONTROLLER
   - flashes the active effect's name (VJ tag) when a drop hits
   - cycles moody ambient phrases during the calm stretches
   ============================================================ */
const EFFECT_TAGS = {
  chroma:   'CHROMATIC SLAM',
  kaleido:  'KALEIDOSCOPE',
  echoes:   'ECHO CHAMBER',
  rgbsplit: 'SIGNAL SPLIT',
  invert:   'NEGATIVE EXPOSURE',
  shear:    'DATA CORRUPTION',
  mirror:   'THROUGH THE GLASS',
  orbit:    'THE MANY JACKSONS',
  pulse:    'STEADY HAND',
};
const AMBIENT_LINES = [
  'TWENTY DOLLARS · BASS TRIGGERED',
  'OLD HICKORY IS WATCHING',
  'FEED THE MACHINE',
  'TURN IT UP LOUDER',
  'THE PORTRAIT REMEMBERS',
  'SPECIE CIRCULAR // 1836',
  'NO TREASURE BUT SOUND',
  'DUEL AT DAWN',
  'LET THE BASS DECIDE',
  'HE VETOES YOUR SILENCE',
  'AJ',
];

let hintLocked = 0;     // timestamp until which the effect tag stays put
let ambientIdx = 0;
let nextAmbient = 0;

function setHintText(txt) {
  hint.classList.add('swap');
  setTimeout(() => { hint.textContent = txt; hint.classList.remove('swap'); }, 180);
}

function flashEffectName(id) {
  const tag = EFFECT_TAGS[id] || id.toUpperCase();
  hint.textContent = tag;
  hint.classList.remove('swap');
  hint.classList.add('flash');
  hintLocked = performance.now() + 1100; // hold the tag ~1.1s
}

// called each frame from the render loop
function updateHint(now) {
  if (now < hintLocked) return;          // effect tag still showing
  if (hint.classList.contains('flash')) hint.classList.remove('flash');
  // cycle ambient phrases on a relaxed timer while nothing's flashing
  if (nextAmbient === 0) nextAmbient = now + 3500;
  if (now >= nextAmbient) {
    ambientIdx = (ambientIdx + 1) % AMBIENT_LINES.length;
    setHintText(AMBIENT_LINES[ambientIdx]);
    nextAmbient = now + 4200 + Math.random()*2500; // 4–7s per line
  }
}

imgInput.addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => { customImg = img; buildPortrait(port.width, port.height); };
  img.src = URL.createObjectURL(f);
});

fileInput.addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  if (audioEl) audioEl.pause();
  audioEl = new Audio(URL.createObjectURL(f));
  audioEl.crossOrigin = 'anonymous';
  trackname.textContent = f.name;
  setupAudio();
  playBtn.textContent = 'Play'; playing = false;

  // wire up the scrubber for this track
  scrubwrap.classList.remove('disabled');
  audioEl.addEventListener('loadedmetadata', () => {
    tdur.textContent = fmtTime(audioEl.duration);
    updateScrub();
  });
  audioEl.addEventListener('timeupdate', () => { if (!scrubbing) updateScrub(); });
  audioEl.addEventListener('ended', () => { playing = false; playBtn.textContent = 'Play'; });
});

function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m + ':' + (sec<10?'0':'') + sec;
}

function updateScrub() {
  if (!audioEl || !audioEl.duration) return;
  const pct = (audioEl.currentTime / audioEl.duration) * 100;
  scrubfill.style.width = pct + '%';
  scrubhandle.style.left = pct + '%';
  tcur.textContent = fmtTime(audioEl.currentTime);
}

/* ---- SCRUBBER drag/seek (mouse + touch) ---- */
let scrubbing = false;

function seekFromClientX(clientX) {
  if (!audioEl || !audioEl.duration) return;
  const rect = scrubtrack.getBoundingClientRect();
  let pct = (clientX - rect.left) / rect.width;
  pct = Math.max(0, Math.min(1, pct));
  const pctScreen = pct * 100;
  scrubfill.style.width = pctScreen + '%';
  scrubhandle.style.left = pctScreen + '%';
  tcur.textContent = fmtTime(pct * audioEl.duration);
  return pct;
}

function scrubStart(clientX) {
  if (!audioEl || !audioEl.duration) return;
  scrubbing = true;
  resetIdle();
  seekFromClientX(clientX);
}
function scrubMove(clientX) { if (scrubbing) seekFromClientX(clientX); }
function scrubEnd(clientX) {
  if (!scrubbing) return;
  const pct = seekFromClientX(clientX);
  if (pct != null) audioEl.currentTime = pct * audioEl.duration;
  scrubbing = false;
}

// mouse
scrubtrack.addEventListener('mousedown', e => { scrubStart(e.clientX); e.preventDefault(); });
window.addEventListener('mousemove', e => scrubMove(e.clientX));
window.addEventListener('mouseup', e => scrubEnd(e.clientX));
// touch
scrubtrack.addEventListener('touchstart', e => { scrubStart(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchmove', e => { if (scrubbing) { scrubMove(e.touches[0].clientX); e.preventDefault(); } }, { passive: false });
window.addEventListener('touchend', e => { const t = e.changedTouches[0]; scrubEnd(t ? t.clientX : 0); });

function setupAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (srcNode) srcNode.disconnect();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.6;
  srcNode = audioCtx.createMediaElementSource(audioEl);
  srcNode.connect(analyser);
  analyser.connect(audioCtx.destination);
  freqData = new Uint8Array(analyser.frequencyBinCount);
}

playBtn.addEventListener('click', () => {
  if (!audioEl) { trackname.textContent = 'load a mix first'; return; }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (playing) { audioEl.pause(); playBtn.textContent='Play'; }
  else { audioEl.play(); playBtn.textContent='Pause'; }
  playing = !playing;
});

let idleTimer;
function resetIdle() {
  dock.classList.remove('hidden'); hint.classList.remove('hidden');
  meter.classList.remove('hidden'); scrubwrap.classList.remove('hidden');
  const g = document.getElementById('gear');
  const p = document.getElementById('panel');

  idleTimer = setTimeout(() => {
    if (playing && !scrubbing) {
      dock.classList.add('hidden'); hint.classList.add('hidden');
      meter.classList.add('hidden'); scrubwrap.classList.add('hidden');
      if (g && p && !p.classList.contains('open')) g.classList.add('hidden');
    }
  }, 3200);
}
window.addEventListener('mousemove', resetIdle);
window.addEventListener('touchstart', resetIdle, { passive: true });
resetIdle();

/* ============================================================
   BASS DETECTION  (the real fix)
   - baseline adapts SLOWLY and only downward-biased, so heavy
     sustained bass keeps registering instead of the baseline
     creeping up and cancelling everything out.
   - two responses: continuous "bassEnv" drives ongoing warp,
     transient "dropFlash" fires on punches. Heavy bass now
     produces continuous heavy warping, not a one-shot.
   ============================================================ */
let bassEnv = 0;      // fast-smoothed current bass level (drives continuous warp)
let bassFloor = 0.05; // slow baseline; asymmetric so it doesn't chase peaks
let dropFlash = 0;    // transient impulse on a punch
let lastDrop = 0;

// ---- effect variety state ----
let dropId = 'chroma';   // which effect the current drop is running
let dropSeed = 0;
let shockR = 0, shockOn = false; // expanding shockwave ring
let lastPick = '';

// ---- mirror flip state ----
let flipSign = 1;        // target horizontal direction: 1 normal, -1 mirrored
let flipT = 1;           // animated scaleX, eases toward flipSign
let nextIdleFlip = 0;    // timestamp for the next automatic idle flip

// ---- kaleidoscope lingering tail ----
let kaleidoHold = 0;     // decays slowly so the kaleidoscope lingers + fades out

// note names for key-based mapping
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

// detect the dominant musical note from the current spectrum.
// returns 0..11 (pitch class). Uses the mid frequencies where notes are clearest.
function detectNote() {
  if (!analyser || !audioCtx) return 0;
  analyser.getByteFrequencyData(freqData);
  const nyquist = audioCtx.sampleRate / 2;
  const bins = freqData.length;
  const pcp = new Array(12).fill(0); // pitch class profile
  // scan a musical range ~80Hz–2000Hz
  for (let i = 1; i < bins; i++) {
    const freq = i / bins * nyquist;
    if (freq < 80 || freq > 2000) continue;
    const mag = freqData[i];
    if (mag < 40) continue;
    const midi = 69 + 12 * Math.log2(freq / 440);
    const pc = ((Math.round(midi) % 12) + 12) % 12;
    pcp[pc] += mag;
  }
  let best = 0, bestV = -1;
  for (let i=0;i<12;i++) if (pcp[i] > bestV) { bestV = pcp[i]; best = i; }
  return best;
}

// choose an effect id according to the active selection mode
function chooseEffect() {
  const enabled = EFFECTS.filter(e => e.on);
  if (enabled.length === 0) return 'chroma';

  if (config.selection === 'lock') {
    return config.lockId;
  }
  if (config.selection === 'cycle') {
    const e = enabled[config.cycleIdx % enabled.length];
    config.cycleIdx++;
    return e.id;
  }
  if (config.selection === 'key') {
    // map the detected note (0..11) onto the enabled effects.
    // same note always lands on the same effect, so it tracks the key.
    const note = detectNote();
    lastNote = note;
    const e = enabled[note % enabled.length];
    return e.id;
  }
  // random (no immediate repeat)
  let pick = enabled[(Math.random()*enabled.length)|0].id;
  if (pick === lastPick && enabled.length > 1) {
    const others = enabled.filter(e => e.id !== lastPick);
    pick = others[(Math.random()*others.length)|0].id;
  }
  lastPick = pick;
  return pick;
}
let lastNote = -1;

function readBass() {
  if (!analyser) return 0;
  analyser.getByteFrequencyData(freqData);
  let sum = 0, n = 0;
  for (let i = 1; i <= 8; i++) { sum += freqData[i]; n++; } // ~20–170Hz
  return (sum / n) / 255;
}

let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const aspect = 16/9;
  let w = window.innerWidth, h = window.innerHeight;
  if (w/h > aspect) w = h*aspect; else h = w/aspect;
  W = Math.floor(w); H = Math.floor(h);
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildPortrait(Math.floor(W*0.8), Math.floor(H*0.92));
}
window.addEventListener('resize', resize);
let orientTimer;
window.addEventListener('orientationchange', () => {
  clearTimeout(orientTimer);
  orientTimer = setTimeout(resize, 250); // wait for viewport to settle after rotation
});

function frame(t) {
  requestAnimationFrame(frame);
  const now = t || 0;
  const sens = parseFloat(sensSlider.value);

  const raw = readBass();
  const bass = raw * sens;

  // fast envelope follows the beat
  bassEnv += (bass - bassEnv) * 0.4;

  // asymmetric floor: rises very slowly, falls a bit faster.
  // stays BELOW sustained bass so drops keep clearing threshold.
  if (bass > bassFloor) bassFloor += (bass - bassFloor) * 0.006;
  else                  bassFloor += (bass - bassFloor) * 0.03;
  bassFloor = Math.max(bassFloor, 0.03);

  // transient: fire when we punch above floor. Slightly higher gate +
  // longer refractory = fewer, cleaner hits instead of constant chatter.
  const over = bassEnv - bassFloor;
  const isNewDrop = over > 0.13 && bassEnv > 0.30 && now - lastDrop > 160;
  if (isNewDrop) {
    // a genuinely new drop: slam the flash and pick a fresh effect/seed.
    // only pick a new effect if the previous drop has mostly rung out, so
    // we don't visually reset in the MIDDLE of a sustained drop.
    if (dropFlash < 0.4) {
      dropId = chooseEffect();
      dropSeed = Math.random() * 1000;
      // the mirror effect flips the image on the beat
      if (dropId === 'mirror') flipSign = -flipSign;
      flashEffectName(dropId); // VJ-style tag naming the effect
    }
    dropFlash = Math.min(1.4, dropFlash + 0.9 + over*1.4);
    lastDrop = now;
    if (OVERLAYS.shockwave) { shockR = 0; shockOn = true; }
  }

  // SUSTAIN: while bass is still heavy, hold the flash up near the live
  // bass level instead of decaying. This keeps effects strong through the
  // whole drop rather than peaking then petering out mid-drop.
  const sustainTarget = Math.max(0, bassEnv - bassFloor) * 1.6; // how much the ongoing bass supports
  if (sustainTarget > dropFlash) {
    dropFlash += (sustainTarget - dropFlash) * 0.25; // rise toward sustain
  } else {
    dropFlash *= 0.9; // decay only when the bass actually eases off
  }
  dropFlash = Math.min(dropFlash, 1.4);

  // meter reflects live bass so you can SEE reactivity
  meterfill.style.height = Math.min(100, bassEnv*140) + '%';

  // cycle the top text (effect tags on drops, ambient phrases when calm)
  updateHint(now);

  // occasional automatic idle flip (only between drops, so it reads as a
  // subtle idle motion rather than competing with the beat).
  if (OVERLAYS.idleflip && playing && dropFlash < 0.25) {
    if (nextIdleFlip === 0) nextIdleFlip = now + 4000 + Math.random()*6000;
    if (now >= nextIdleFlip) {
      flipSign = -flipSign;
      nextIdleFlip = now + 5000 + Math.random()*7000; // 5–12s between idle flips
    }
  }
  // ease the animated scaleX toward the target sign (smooth flip, not a snap)
  flipT += (flipSign - flipT) * 0.14;

  // continuous warp kept minimal now — just enough to feel alive between drops.
  const warp = Math.min(1, bassEnv*1.4);
  const ambient = warp*0.25; // heavily damped ambient contribution

  // ---- draw ----
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);

  const pw = port.width, ph = port.height;
  const baseScale = Math.min(W/pw, H/ph) * 0.92;
  const breathe = 1 + Math.sin(now*0.0011)*0.010;
  // punch dominated by transients now, hitting much harder on drops
  const punch = 1 + dropFlash*0.30 + ambient*0.10;
  const scale = baseScale * breathe * punch;
  const dw = pw*scale, dh = ph*scale;
  const dx = (W-dw)/2, dy = (H-dh)/2;

  // wobble: slow idle sway + a kick on the drop
  const wob = Math.sin(now*0.0016)*0.004 + dropFlash*0.03*Math.sin(now*0.03);

  const I = config.intensity; // global intensity multiplier
  const geo = { dx, dy, dw, dh, scale, pw, ph, now, wob, dropFlash: dropFlash*I, ambient, seed: dropSeed };

  // apply the mirror flip around screen center. flipT eases between +1 and
  // -1; a small floor keeps it from collapsing to zero width mid-flip.
  ctx.save();
  const fx = (Math.abs(flipT) < 0.06) ? (flipT < 0 ? -0.06 : 0.06) : flipT;
  ctx.translate(W/2, 0);
  ctx.scale(fx, 1);
  ctx.translate(-W/2, 0);

  // route to the active effect. Effects take over only while a drop rings
  // out; otherwise the calm base render.
  // Kaleidoscope gets a lingering tail: while it's the active effect and a
  // drop is live, top up kaleidoHold; then it decays slowly and cross-fades
  // back into the base render instead of snapping off.
  if (dropId === 'kaleido' && dropFlash > 0.12) {
    kaleidoHold = 1;
  } else {
    kaleidoHold *= 0.975; // slow release (~a couple seconds of tail)
  }

  if (dropFlash > 0.12) {
    switch (dropId) {
      case 'kaleido':  drawKaleido(geo); break;
      case 'echoes':   drawEchoes(geo); break;
      case 'rgbsplit': drawRGBSplit(geo); break;
      case 'invert':   drawInvertFlash(geo); break;
      case 'shear':    drawShear(geo); break;
      case 'mirror':   drawMirror(geo); break;
      case 'orbit':    drawOrbit(geo); break;
      case 'pulse':    drawPulse(geo); break;
      default:         drawChroma(geo); break;
    }
  } else if (kaleidoHold > 0.04) {
    // kaleidoscope tail: draw the calm base, then the fading kaleidoscope over it
    drawBase(geo);
    drawKaleido(geo, Math.min(1, kaleidoHold));
  } else {
    drawBase(geo);
  }
  ctx.restore();

  // themed menace wash: quiet baseline, big flare on the drop
  const wr = THEME.wash;
  ctx.fillStyle = `rgba(${wr[0]},${wr[1]},${wr[2]},${0.04 + ambient*0.06 + dropFlash*0.30*I})`;
  ctx.fillRect(0,0,W,H);

  // expanding shockwave ring on the drop
  if (shockOn && OVERLAYS.shockwave) {
    shockR += (W*0.9 - shockR) * 0.12 + 6;
    const a = Math.max(0, 1 - shockR/(W*0.85));
    if (a <= 0.02) { shockOn = false; }
    else {
      ctx.save();
      ctx.strokeStyle = hexA(THEME.menace, a*0.6);
      ctx.lineWidth = 2 + a*6;
      ctx.beginPath(); ctx.arc(W/2, H/2, shockR, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = hexA(THEME.bone, a*0.25);
      ctx.lineWidth = 1 + a*2;
      ctx.beginPath(); ctx.arc(W/2, H/2, shockR*0.7, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }

  // glitch slices fire on the harder drops
  if (OVERLAYS.slices && dropFlash*I > 0.45) {
    const intensity = dropFlash*I;
    const slices = 3 + Math.floor(intensity*10);
    for (let i=0;i<slices;i++){
      const sy = Math.random()*H;
      const sh = 4 + Math.random()*32;
      const off = (Math.random()-0.5)*intensity*90;
      ctx.drawImage(canvas, 0, sy*DPR, canvas.width, sh*DPR, off, sy, W, sh);
    }
  }

  // between-drop life: slow VHS tracking band drifting down the screen
  if (OVERLAYS.tracking) drawTracking(now, ambient);

  drawScanlines();
  if (OVERLAYS.grain) drawGrain(Math.max(ambient*0.4, dropFlash*0.9));
  drawVignette();
}

// hex + alpha -> rgba() string helper
function hexA(hex, a) {
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---------- portrait render helpers (each = one "mood") ---------- */

// draw the portrait once with optional pixel offset + tint layer
function blitPortrait(g, ox=0, oy=0, alpha=1, comp='source-over', tint=null) {
  ctx.globalCompositeOperation = comp;
  ctx.globalAlpha = alpha;
  ctx.drawImage(port, g.dx+ox, g.dy+oy, g.dw, g.dh);
  if (tint) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = tint;
    ctx.fillRect(g.dx+ox, g.dy+oy, g.dw, g.dh);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// MODE default/0: the classic chroma-aberration slam
function drawChroma(g) {
  const chroma = 2 + g.dropFlash*40 + g.ambient*6;
  ctx.save();
  ctx.translate(W/2,H/2); ctx.rotate(g.wob); ctx.translate(-W/2,-H/2);
  blitPortrait(g, -chroma, 0, 0.9, 'lighter');
  blitPortrait(g, 0, 0, 0.95, 'source-over');
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.5;
  ctx.fillStyle = THEME.accent2; ctx.fillRect(g.dx+chroma,g.dy,g.dw,g.dh);
  ctx.restore();
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

// MODE mirror: the flip itself is the star (driven by flipT in the outer
// transform). Here we add a brief "seam" glint down the center as it flips,
// plus a light chroma edge so the hit still has punch.
function drawMirror(g) {
  const chroma = 2 + g.dropFlash*20;
  ctx.save();
  ctx.translate(W/2,H/2); ctx.rotate(g.wob); ctx.translate(-W/2,-H/2);
  blitPortrait(g, -chroma, 0, 0.9, 'lighter');
  blitPortrait(g, 0, 0, 0.95, 'source-over');
  blitPortrait(g, chroma, 0, 0.4, 'lighter');
  ctx.restore();
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  // vertical seam glint at the mirror axis, brightest mid-flip (|flipT|~0)
  const seam = 1 - Math.min(1, Math.abs(flipT));
  if (seam > 0.05) {
    const grd = ctx.createLinearGradient(W/2-40,0,W/2+40,0);
    grd.addColorStop(0,'rgba(0,0,0,0)');
    grd.addColorStop(0.5, hexA(THEME.bone, seam*0.5));
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(W/2-40, 0, 80, H);
  }
}

// calm base render used between drops
function drawBase(g) {
  const chroma = 2 + g.ambient*6;
  ctx.save();
  ctx.translate(W/2,H/2); ctx.rotate(g.wob); ctx.translate(-W/2,-H/2);
  blitPortrait(g, -chroma, 0, 0.85, 'lighter');
  blitPortrait(g, 0, 0, 0.95, 'source-over');
  ctx.restore();
}

// MODE pulse: the "clean minimal" look. A soft zoom push with a faint
// chroma edge and a gentle bloom — cinematic and restrained, no glitch.
function drawPulse(g) {
  // extra inward push on the drop, eased by dropFlash
  const push = 1 + g.dropFlash*0.06;
  const pw = g.dw*push, ph = g.dh*push;
  const px = W/2 - pw/2, py = H/2 - ph/2;
  const chroma = 1 + g.dropFlash*8; // very subtle edge separation

  ctx.save();
  ctx.translate(W/2,H/2); ctx.rotate(g.wob*0.5); ctx.translate(-W/2,-H/2);
  // faint chroma ghost
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.35;
  ctx.drawImage(port, px-chroma, py, pw, ph);
  // main portrait
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=0.97;
  ctx.drawImage(port, px, py, pw, ph);
  ctx.restore();

  // soft central bloom that swells with the hit — the "breath"
  ctx.globalCompositeOperation='lighter';
  const bloom = ctx.createRadialGradient(W/2,H/2,10, W/2,H/2, Math.min(W,H)*0.45);
  bloom.addColorStop(0, hexA(THEME.menace, 0.05 + g.dropFlash*0.12));
  bloom.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bloom;
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha = 1;
}

// MODE orbit: a shrunken center Andy with N smaller copies orbiting a ring.
// count is user-set (1–9). The ring spins over time and pulses on the drop.
function drawOrbit(g) {
  const count = Math.max(1, Math.min(9, config.orbitCount|0));
  // center copy, pulled in a bit so the ring reads clearly
  const cScale = 0.5 + g.dropFlash*0.05;
  const cw = g.dw*cScale, ch = g.dh*cScale;
  ctx.globalAlpha = 0.95;
  ctx.drawImage(port, W/2 - cw/2, H/2 - ch/2, cw, ch);

  // orbiting satellites
  const R = Math.min(W,H) * (0.30 + g.dropFlash*0.05); // ring radius, breathes on hits
  const spin = g.now*0.0009 + g.seed*0.01;            // continuous rotation
  const sScale = 0.26 + g.dropFlash*0.03;             // little-Andy size
  const sw = g.dw*sScale, sh = g.dh*sScale;
  for (let i=0;i<count;i++){
    const ang = spin + (Math.PI*2/count)*i;
    const x = W/2 + Math.cos(ang)*R;
    const y = H/2 + Math.sin(ang)*R;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang + Math.PI/2);          // face along the orbit
    ctx.globalAlpha = 0.9;
    ctx.drawImage(port, -sw/2, -sh/2, sw, sh);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // faint themed ring guide + core glow
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = hexA(THEME.menace, 0.12 + g.dropFlash*0.15);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(W/2, H/2, R, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = hexA(THEME.grade, 0.10 + g.dropFlash*0.15);
  ctx.beginPath(); ctx.arc(W/2, H/2, cw*0.4, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

// MODE 1: kaleidoscope — mirror the portrait into wedges
// fade (0..1) lets the lingering tail cross-blend back to the base render
function drawKaleido(g, fade=1) {
  const segs = 6;
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(g.seed*0.01 + g.now*0.0006);
  const R = Math.max(W,H);
  for (let i=0;i<segs;i++){
    ctx.save();
    ctx.rotate((Math.PI*2/segs)*i);
    if (i%2) ctx.scale(1,-1); // flip alternate wedges for the mirror effect
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,R, -Math.PI/segs, Math.PI/segs);
    ctx.closePath();
    ctx.clip();
    ctx.globalAlpha = 0.95 * fade;
    ctx.drawImage(port, -g.dw/2, -g.dh/2 - g.dh*0.15, g.dw, g.dh);
    ctx.restore();
  }
  ctx.restore();
  // themed core glow
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha = fade;
  ctx.fillStyle = hexA(THEME.grade, 0.15+g.dropFlash*0.2);
  ctx.beginPath(); ctx.arc(W/2,H/2, g.dw*0.2, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha = 1;
}

// MODE 2: echoes — Andy multiplies into trailing copies
function drawEchoes(g) {
  const n = 5;
  const dir = g.seed % 2 < 1 ? 1 : -1;
  for (let i=n; i>=1; i--){
    const f = i/n;
    const off = dir * f * g.dropFlash * 70;
    const sc = 1 + f*g.dropFlash*0.15;
    const w = g.dw*sc, h = g.dh*sc;
    ctx.globalAlpha = 0.16 * (1-f) + 0.08;
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(port, W/2 - w/2 + off, H/2 - h/2, w, h);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation='source-over';
  ctx.drawImage(port, g.dx, g.dy, g.dw, g.dh);
}

// MODE 3: hard RGB channel split (red/green/blue pull apart)
function drawRGBSplit(g) {
  const s = 3 + g.dropFlash*36;
  const ang = g.seed*0.02;
  const ox = Math.cos(ang)*s, oy = Math.sin(ang)*s;
  ctx.globalCompositeOperation = 'lighter';
  // red channel
  ctx.globalAlpha = 0.85; ctx.drawImage(port, g.dx+ox, g.dy+oy, g.dw, g.dh);
  ctx.fillStyle='#ff0010'; ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.4;
  ctx.fillRect(g.dx+ox,g.dy+oy,g.dw,g.dh);
  // blue-ish channel opposite
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.7;
  ctx.drawImage(port, g.dx-ox, g.dy-oy, g.dw, g.dh);
  ctx.fillStyle='#3020ff'; ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.25;
  ctx.fillRect(g.dx-ox,g.dy-oy,g.dw,g.dh);
  // center anchor
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=0.9;
  ctx.drawImage(port, g.dx, g.dy, g.dw, g.dh);
  ctx.globalAlpha=1;
}

// MODE 4: invert / solarize flash
function drawInvertFlash(g) {
  drawBase(g);
  ctx.save();
  ctx.globalCompositeOperation = 'difference';
  ctx.globalAlpha = Math.min(0.9, g.dropFlash);
  ctx.fillStyle = '#e8dccb';
  ctx.fillRect(0,0,W,H);
  ctx.restore();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// MODE 5: shear glitch — portrait skewed hard then snapping back
function drawShear(g) {
  const sh = (g.seed%2<1?1:-1) * g.dropFlash * 0.5;
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.transform(1, sh*0.3, sh, 1, 0, 0);
  ctx.globalAlpha = 0.95;
  ctx.drawImage(port, -g.dw/2, -g.dh/2, g.dw, g.dh);
  ctx.restore();
  // horizontal datamosh bars
  const bars = 4 + Math.floor(g.dropFlash*6);
  for (let i=0;i<bars;i++){
    const sy = Math.random()*H, hh = 6+Math.random()*24;
    const off = (Math.random()-0.5)*g.dropFlash*120;
    ctx.drawImage(port,
      0, (sy-g.dy)/g.scale*g.pw/g.dw*g.ph, g.pw, hh/g.scale,
      g.dx+off, sy, g.dw, hh);
  }
  ctx.globalAlpha = 1;
}

// between-drop VHS tracking band that slowly drifts down
let trackY = 0;
function drawTracking(now, ambient) {
  trackY = (trackY + 0.6) % (H + 120);
  const y = H - trackY;
  const bandH = 60;
  ctx.save();
  // displace a thin horizontal strip sideways for the tracking-error look
  const off = 6 + ambient*20 + Math.sin(now*0.01)*4;
  ctx.globalAlpha = 0.5;
  ctx.drawImage(canvas, 0, y*DPR, canvas.width, bandH*DPR, off, y, W, bandH);
  // faint bright seam
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#f6efe2';
  ctx.fillRect(0, y, W, 2);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawScanlines() {
  ctx.save(); ctx.globalAlpha=0.14; ctx.fillStyle='#000';
  for (let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
  ctx.restore();
}
let grainCanvas, gctx;
function drawGrain(intensity) {
  if (!grainCanvas){ grainCanvas=document.createElement('canvas'); grainCanvas.width=128; grainCanvas.height=128; gctx=grainCanvas.getContext('2d'); }
  const img = gctx.createImageData(128,128);
  const amt = 40 + intensity*140;
  const gr = THEME.wash; // tint grain toward theme
  for (let i=0;i<img.data.length;i+=4){
    const v = Math.random()*amt;
    img.data[i]   = v*(gr[0]/160);
    img.data[i+1] = v*(gr[1]/160 + 0.05);
    img.data[i+2] = v*(gr[2]/160 + 0.05);
    img.data[i+3] = Math.random()*45;
  }
  gctx.putImageData(img,0,0);
  ctx.save(); ctx.globalAlpha=0.5; ctx.globalCompositeOperation='screen';
  ctx.fillStyle = ctx.createPattern(grainCanvas,'repeat'); ctx.fillRect(0,0,W,H);
  ctx.restore();
}
function drawVignette() {
  const g = ctx.createRadialGradient(W/2,H/2,H*0.3, W/2,H/2,H*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.85)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

resize();
requestAnimationFrame(frame);

/* ============================================================
   SETTINGS PANEL WIRING
   ============================================================ */
const gear = document.getElementById('gear');
const panel = document.getElementById('panel');
const panelclose = document.getElementById('panelclose');
gear.addEventListener('click', () => { panel.classList.toggle('open'); resetIdle(); });
panelclose.addEventListener('click', () => panel.classList.remove('open'));

// ---- build effect toggles ----
const fxToggles = document.getElementById('fxtoggles');
EFFECTS.forEach(fx => {
  const row = document.createElement('div');
  row.className = 'prow';
  row.innerHTML = `<span class="plabel">${fx.label}</span>
    <label class="sw" for="fx_${fx.id}"><input type="checkbox" id="fx_${fx.id}" ${fx.on?'checked':''}><span class="track"></span><span class="knob"></span></label>`;
  fxToggles.appendChild(row);
  row.querySelector('input').addEventListener('change', e => {
    fx.on = e.target.checked;
    // never allow zero enabled effects
    if (!EFFECTS.some(x=>x.on)) { fx.on = true; e.target.checked = true; }
    rebuildLockPicker();
  });
});

// ---- overlay toggles (append to effects section) ----
const OVERLAY_LABELS = { shockwave:'Shockwave Ring', tracking:'VHS Tracking', slices:'Glitch Slices', grain:'Film Grain', idleflip:'Idle Mirror Flips' };
Object.keys(OVERLAYS).forEach(key => {
  const row = document.createElement('div');
  row.className = 'prow';
  row.innerHTML = `<span class="plabel">${OVERLAY_LABELS[key]}</span>
    <label class="sw" for="ov_${key}"><input type="checkbox" id="ov_${key}" ${OVERLAYS[key]?'checked':''}><span class="track"></span><span class="knob"></span></label>`;
  fxToggles.appendChild(row);
  row.querySelector('input').addEventListener('change', e => { OVERLAYS[key] = e.target.checked; });
});

// ---- theme chips ----
document.getElementById('themes').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  setTheme(b.dataset.theme);
  [...b.parentElement.children].forEach(c => c.classList.toggle('active', c===b));
});

// ---- selection mode chips ----
const lockpick = document.getElementById('lockpick');
document.getElementById('selmodes').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  config.selection = b.dataset.sel;
  [...b.parentElement.children].forEach(c => c.classList.toggle('active', c===b));
  lockpick.style.display = (config.selection==='lock') ? 'block' : 'none';
  keyReadout.style.display = (config.selection==='key') ? 'block' : 'none';
});

// lock picker (choose the single locked effect)
const lockEffectsEl = document.getElementById('lockeffects');
function rebuildLockPicker() {
  lockEffectsEl.innerHTML = '';
  EFFECTS.filter(e=>e.on).forEach(fx => {
    const b = document.createElement('button');
    b.className = 'chip' + (config.lockId===fx.id?' active':'');
    b.textContent = fx.label; b.dataset.id = fx.id;
    b.addEventListener('click', () => {
      config.lockId = fx.id;
      [...lockEffectsEl.children].forEach(c=>c.classList.toggle('active', c===b));
    });
    lockEffectsEl.appendChild(b);
  });
  if (!EFFECTS.some(e=>e.on && e.id===config.lockId)) {
    const first = EFFECTS.find(e=>e.on); if (first) config.lockId = first.id;
  }
}
rebuildLockPicker();

// key readout (shows the detected note when By Key mode is active)
const keyReadout = document.createElement('div');
keyReadout.style.cssText = 'margin-top:8px;font-size:11px;letter-spacing:.15em;color:var(--bone);opacity:.8;text-transform:uppercase;display:none;';
keyReadout.innerHTML = 'Detected: <span id="notedisp">—</span>';
document.getElementById('selmodes').after(keyReadout);
const noteDisp = () => document.getElementById('notedisp');
setInterval(() => {
  if (config.selection==='key' && playing) {
    const nd = noteDisp();
    if (nd && lastNote>=0) nd.textContent = NOTE_NAMES[lastNote];
  }
}, 200);

// ---- intensity ----
document.getElementById('intensity').addEventListener('input', e => { config.intensity = parseFloat(e.target.value); });
const orbitSlider = document.getElementById('orbitcount');
const orbitVal = document.getElementById('orbitval');
orbitSlider.addEventListener('input', e => {
  config.orbitCount = parseInt(e.target.value, 10);
  orbitVal.textContent = config.orbitCount;
});

// ---- presets ----
const PRESETS = {
  menace:   { fx:['chroma','rgbsplit','shear'], ov:{shockwave:true,tracking:true,slices:true,grain:true,idleflip:false}, sel:'random', intensity:1.1, theme:'red' },
  fulltrip: { fx:['chroma','kaleido','echoes','rgbsplit','invert','shear','mirror','orbit'], ov:{shockwave:true,tracking:true,slices:true,grain:true,idleflip:true}, sel:'key', intensity:1.4, theme:'purple' },
  minimal:  { fx:['pulse'], ov:{shockwave:true,tracking:false,slices:false,grain:true,idleflip:false}, sel:'lock', intensity:0.9, theme:'red' },
  vhs:      { fx:['invert','shear','echoes','mirror'], ov:{shockwave:false,tracking:true,slices:true,grain:true,idleflip:true}, sel:'random', intensity:1.0, theme:'green' },
};
document.getElementById('presets').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  applyPreset(PRESETS[b.dataset.preset]);
  [...b.parentElement.children].forEach(c => c.classList.toggle('active', c===b));
});
function applyPreset(p) {
  if (!p) return;
  EFFECTS.forEach(fx => { fx.on = p.fx.includes(fx.id); const el=document.getElementById('fx_'+fx.id); if(el) el.checked = fx.on; });
  Object.keys(OVERLAYS).forEach(k => { OVERLAYS[k]=p.ov[k]; const el=document.getElementById('ov_'+k); if(el) el.checked=OVERLAYS[k]; });
  config.selection = p.sel;
  [...document.getElementById('selmodes').children].forEach(c => c.classList.toggle('active', c.dataset.sel===p.sel));
  lockpick.style.display = (p.sel==='lock')?'block':'none';
  keyReadout.style.display = (p.sel==='key')?'block':'none';
  if (p.sel==='lock' && p.fx.length) config.lockId = p.fx[0];
  config.intensity = p.intensity;
  document.getElementById('intensity').value = p.intensity;
  setTheme(p.theme);
  [...document.getElementById('themes').children].forEach(c => c.classList.toggle('active', c.dataset.theme===p.theme));
  rebuildLockPicker();
}
</script>
</body>
</html>
