<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 | CobertOS</title>
    <meta name="description" content="This page doesn't exist on CobertOS.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#c892f9">
    <link rel="icon" type="image/x-icon" href="/images/mascot.png" />
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        html { background: linear-gradient(180deg, #0c0d0f, #14161b) fixed #14161b; }
        body { margin: 0; color: rgb(200, 146, 249); }
        .err-wrap {
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }
        .err-box {
            width: 100%;
            max-width: 620px;
            text-align: left;
            font-family: Consolas, "Cascadia Mono", Menlo, monospace;
            border: 1px solid rgba(255, 122, 144, 0.45);
            border-radius: 12px;
            background: rgba(8, 8, 10, 0.9);
            box-shadow: 0 0 22px rgba(255, 122, 144, 0.18);
            overflow: hidden;
        }
        .err-bar {
            padding: 8px 14px;
            font-size: 0.8rem;
            color: #ff7a90;
            border-bottom: 1px solid rgba(255, 122, 144, 0.3);
            background: rgba(255, 122, 144, 0.07);
        }
        .err-body { padding: 18px 20px 22px; line-height: 1.6; font-size: 0.92rem; }
        .err-code {
            font-size: 3.2rem;
            margin: 0 0 4px;
            color: #ff7a90;
            text-shadow: 0 0 14px rgba(255, 122, 144, 0.5);
            animation: errFlicker 3s infinite;
        }
        .err-body p { margin: 4px 0; }
        .err-dim { opacity: 0.6; }
        .err-path { color: #fff; word-break: break-all; }
        .err-actions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
        .err-actions a {
            text-decoration: none;
            color: rgb(200, 146, 249);
            padding: 7px 14px;
            border: 1px solid rgba(200, 146, 249, 0.35);
            border-radius: 6px;
            transition: 0.2s;
        }
        .err-actions a:hover {
            color: #fff;
            border-color: rgb(200, 146, 249);
            box-shadow: 0 0 8px rgba(200, 146, 249, 0.6);
        }
        .err-count { color: #fff; }
        @keyframes errFlicker {
            0%, 92%, 100% { opacity: 1; }
            94% { opacity: 0.3; }
            96% { opacity: 0.9; }
            98% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <main class="err-wrap">
        <section class="err-box" role="alert">
            <div class="err-bar">⚠ CobertOS — system error</div>
            <div class="err-body">
                <p class="err-code">404</p>
                <p>FATAL: PAGE_NOT_FOUND</p>
                <p class="err-dim">The requested file could not be located:</p>
                <p class="err-path" id="err-path">/</p>
                <p class="err-dim">It may have been moved, deleted, or eaten by a creeper.</p>
                <p style="margin-top:14px">Rebooting to dashboard in <span class="err-count" id="err-count">15</span>s...</p>
                <div class="err-actions">
                    <a href="/">↩ Return to CobertOS</a>
                    <a href="/software.html">Software</a>
                    <a href="/contact.html">Report a broken link</a>
                </div>
            </div>
        </section>
    </main>
    <script>
        document.getElementById("err-path").textContent = window.location.pathname;
        let n = 15;
        const el = document.getElementById("err-count");
        const t = setInterval(() => {
            n--;
            el.textContent = n;
            if (n <= 0) { clearInterval(t); window.location.href = "/"; }
        }, 1000);
    </script>
</body>
</html>
