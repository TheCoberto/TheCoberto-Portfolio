<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kingdom of Crobus Wiki</title>
    <meta name="description" content="A player's guide to the Kingdom of Crobus Minecraft server">
    <link rel="icon" type="image/x-icon" href="images/mascot.png" />
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .wiki { text-align: left; line-height: 1.6; font-size: 1.05rem; }
        .wiki h1 { text-align: center; }
        .wiki h2 { margin-top: 2.2rem; padding-bottom: 6px; border-bottom: 1px solid rgba(200, 146, 249, 0.3); }
        .wiki h3 { margin-top: 1.4rem; }
        .wiki p, .wiki li { color: #e6dcf2; }
        .wiki strong { color: rgb(200, 146, 249); }
        .wiki a { color: rgb(200, 146, 249); }
        .wiki code { background: rgba(200, 146, 249, 0.12); padding: 1px 6px; border-radius: 4px; font-size: 0.95em; color: #f1e6ff; }
        .wiki .table-wrap { overflow-x: auto; margin: 1rem 0; }
        .wiki table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
        .wiki th, .wiki td { border: 1px solid rgba(200, 146, 249, 0.25); padding: 8px 10px; text-align: left; vertical-align: top; color: #e6dcf2; }
        .wiki th { background: rgba(200, 146, 249, 0.12); color: rgb(200, 146, 249); }
        .toc { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0 24px; }
        .toc a { padding: 4px 12px; border: 1px solid rgba(200, 146, 249, 0.35); border-radius: 999px; text-decoration: none; color: rgb(200, 146, 249); font-size: 0.9rem; }
        .toc a:hover { background: rgba(200, 146, 249, 0.12); }
        @media (max-width: 600px) { .container { padding: 24px 16px; } .wiki { font-size: 1rem; } }
    </style>
</head>

<body>

    <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="discord.html">Discord</a>
        <a href="mods.html">Mods</a>
    </nav>

<main class="container">
    <nav class="toc" id="toc" aria-label="Sections"></nav>
    <article class="wiki" id="wiki"><p>Loading the wiki…</p></article>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
    // The wiki text lives in wiki/crobus.md, copied from the server repo by publish-wiki.ps1.
    fetch('wiki/crobus.md', { cache: 'no-cache' })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(md => {
            const wiki = document.getElementById('wiki');
            wiki.innerHTML = marked.parse(md);
            wiki.querySelectorAll('table').forEach(t => {
                const wrap = document.createElement('div');
                wrap.className = 'table-wrap';
                t.replaceWith(wrap);
                wrap.appendChild(t);
            });
            const toc = document.getElementById('toc');
            wiki.querySelectorAll('h2').forEach(h => {
                h.id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                const a = document.createElement('a');
                a.href = '#' + h.id;
                a.textContent = h.textContent;
                toc.appendChild(a);
            });
            if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
        })
        .catch(() => {
            document.getElementById('wiki').innerHTML = '<p>The wiki couldn\'t load. Try refreshing the page.</p>';
        });
</script>

</body>
</html>
